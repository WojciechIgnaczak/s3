version: '3.9'

services:
  nginx:
    image: nginx:latest
    container_name: nginx3
    ports:
      - "8087:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - backend1
      - backend2
    networks:
      - app-network

  backend1:
    image: nginx:latest
    container_name: backend1
    restart: unless-stopped
    volumes:
      - ./backend1.html:/usr/share/nginx/html/index.html
    networks:
      - app-network

  backend2:
    image: nginx:latest
    container_name: backend2
    restart: unless-stopped
    volumes:
      - ./backend2.html:/usr/share/nginx/html/index.html
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    name: app-nginx-network
