events {
    worker_connections 1024;
}

http {
    upstream backend {  # load balancer 
    #   ROUNDROBIN
        # server backend1:80 weight=1;
        # server backend2:80 weight=1;

        # ROUNDROBIN WEIGHTED
        # server backend1:80 weight=3;
        # server backend2:80 weight=1;

        # IP HASH
        #ip_hash;
        # server backend1:80;
        # server backend2:80;

        # LEAST CONNECTION
        # least_conn;
        # server backend1:80;
        # server backend2:80;

        # hash na pomoca nagłówka USER-AGENT
        # hash $request_uri;
        # server backend1:80;
        # server backend2:80;

        # RANDOM
        # random two least_conn=2;
        # server backend1:80;
        # server backend2:80;
        # server backend3:80;

        # HEALTH_CHECK
        server backend1:80 max_fails=3 fail_timeout=30s;
        server backend2:80 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
