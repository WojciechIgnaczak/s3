services:
  strona2porty:
    image: nginx:latest
    container_name: site1
    volumes:
      - ./conf:/etc/nginx/conf.d
      - ./site1:/usr/share/nginx/html/site1:ro # ro= read only
      - ./site2:/usr/share/nginx/html/site2:ro
    ports:
      - "80:80"
      - "90:90"
    restart: unless-stopped

